[package]
name = "matrix-social-credits"
version = "0.0.9-alpha"
edition = "2024"
rust-version = "1.93"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# default-features would pull in e2e-encryption + the sqlite stores. The bot does not
# support encrypted rooms yet, so we keep the dependency tree small for now.
matrix-sdk = { version = "0.18.0", default-features = false }
anyhow = "1.0.104"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["full"] }
regex = "1.13.1"
