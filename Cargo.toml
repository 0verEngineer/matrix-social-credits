[package]
name = "matrix-social-credits"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# e2e-encryption is not optional in practice: matrix-sdk 0.6.2 had it through its default
# features, so the bot has always been able to work in encrypted rooms, and it is being run in
# one. Without the feature it would answer in plaintext into an encrypted room and never see a
# command again.
#
# automatic-room-key-forwarding is part of the upstream defaults but is left off on purpose:
# it only requests and shares room keys between a single user's own devices, and the bot
# account has exactly one.
matrix-sdk = { version = "0.18.0", default-features = false, features = [
    "bundled-sqlite",
    "e2e-encryption",
] }
anyhow = "1.0.104"
# For the weekly payout schedule. chrono-tz carries the IANA database in the binary, so the
# configured time zone works without the image having to ship tzdata.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
